<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sygnatura — wkrótce</title>
  <style>
    :root{--green:#1A4731;--syg:#E8D9B8;--nat:#B8956A;--gold:#C6A35A}
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:var(--green);color:var(--nat);
      font-family:Georgia,"Times New Roman",serif;text-align:center}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:32px 20px;min-height:100vh}
    img{width:min(42vw,160px);height:auto;margin-bottom:28px}
    h1{font-weight:400;font-size:clamp(1.6rem,6vw,2.4rem);letter-spacing:.28em;
      color:var(--syg);margin-bottom:.15em}
    h1 span{color:var(--nat)}
    p{max-width:26rem;line-height:1.7;font-size:1.05rem;margin:18px 0 28px;font-weight:300}
    a{color:var(--syg);letter-spacing:.04em}
    .soon{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
  </style>
</head>
<body>
  <p class="soon">Pracownia</p>
  <img src="sygnet.svg" alt="">
  <h1>SYG<span>NATURA</span></h1>
  <p>Strona w budowie. Drewno na zamówienie — Poznań.<br>Zapraszamy wkrótce.</p>
  <p><a href="mailto:kontakt@studiosygnatura.pl">kontakt@studiosygnatura.pl</a></p>
</body>
</html>
