<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twój koszyk — Studio Sygnatura</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=291">
</head>
<body data-strona="Zamówienia">
<div id="naglowek"></div>

<main class="wrap">
  <span class="tag">Podgląd zamówienia</span>
  <h1>Twój koszyk</h1>
  <p class="sub">Sprawdź produkty przed przejściem do danych. Ilości możesz zmieniać tutaj.</p>

  <div id="progres"></div>
  <div id="koszyk-tresc"></div>

  <div class="przyciski" id="guzy" style="display:none">
    <a class="btn" href="dane.html">Przejdź do danych →</a>
    <a class="btn outline" href="sklep.html">← Wróć do katalogu</a>
  </div>
</main>

<div id="stopka"></div>

<script src="assets/config.js?v=291"></script>
<script src="assets/koszyk.js?v=291"></script>
<script src="assets/api.js?v=291"></script>
<script src="data/katalog.js?v=291"></script>
<script src="assets/main.js?v=291"></script>
<script>
(function(){
  var k = KOSZYK.pobierz();
  var kat = (window.SYG_KATALOG || []).filter(function(p){ return p.dostepny; });
  var kontener = document.getElementById('koszyk-tresc');
  var guzy = document.getElementById('guzy');

  window.PROGRES.wstaw(document.getElementById('progres'), ['Katalog','Dane','Podsumowanie'], 1);

  function foto(pr){
    return (pr.obraz && /^https?:/.test(pr.obraz)) ? pr.obraz : 'assets/media/sklep/' + (pr.obraz || 'szopka.jpg');
  }
  function nazwa(id){ var p = kat.find(function(x){ return Number(x.id) === Number(id); }); return p ? p.nazwa : 'Produkt #' + id; }
  function cena(id){ var p = kat.find(function(x){ return Number(x.id) === Number(id); }); return p ? (Number(p.cena)||0) : 0; }

  function renderuj(){
    if (!k.pozycje.length && !k.pers.length){
      kontener.innerHTML = '<div class="sukces"><h2>Twój koszyk jest pusty</h2>' +
        '<p>Nic jeszcze nie wybrałeś. Zajrzyj do katalogu i dodaj produkty licznikiem −/+.</p>' +
        '<p style="margin-top:16px"><a class="btn" href="sklep.html">Przejdź do katalogu</a></p></div>';
      guzy.style.display = 'none';
      return;
    }
    guzy.style.display = 'flex';
    var html = '<div class="rachunek">' +
      '<div class="rach-naglowek">Zawartość koszyka <span class="mala">zmiany zapisują się automatycznie</span></div>';
    var razem = 0;
    k.pozycje.forEach(function(x){
      var c = cena(x.id);
      razem += c * x.ile;
      html += '<div class="rach-wiersz" data-id="' + x.id + '">' +
        '<span class="r-lp"><img src="' + foto(kat.find(function(p){ return Number(p.id) === Number(x.id); }) || {}) + '" alt="" style="width:44px;height:44px;object-fit:cover"></span>' +
        '<span class="r-poz"><b>' + nazwa(x.id) + '</b>' +
        '<span class="r-pod">' + SYG.zl(c) + ' / szt.</span></span>' +
        '<span class="r-ile"><span class="licznik" style="display:inline-flex">' +
        '<button type="button" class="minus" aria-label="mniej">−</button>' +
        '<span class="val">' + x.ile + '</span>' +
        '<button type="button" class="plus" aria-label="więcej">+</button></span></span>' +
        '<span class="r-cena">' + SYG.zl(c) + '</span>' +
        '<span class="r-wart">' + SYG.zl(c * x.ile) + ' <button type="button" class="usun" aria-label="usuń" style="border:none;background:none;color:#8a2f1d;font-size:16px;cursor:pointer;margin-left:6px">✕</button></span>' +
      '</div>';
    });
    k.pers.forEach(function(p){
      razem += Number(p.cena) || 0;
      html += '<div class="rach-wiersz"><span class="r-lp">—</span>' +
        '<span class="r-poz"><b>' + p.nazwa + '</b> <span class="r-tag">personalizacja</span>' +
        (p.opis ? '<span class="r-pod">' + p.opis + '</span>' : '') + '</span>' +
        '<span class="r-ile">1 szt.</span><span class="r-cena">' + SYG.zl(p.cena) + '</span>' +
        '<span class="r-wart">' + SYG.zl(p.cena) + '</span></div>';
    });
    if (k.pers.length >= SYG.PERS_RABAT_PROG){
      var sumaPers = k.pers.reduce(function(s,p){ return s + (Number(p.cena)||0); }, 0);
      var rabat = Math.round(sumaPers * SYG.PERS_RABAT_PROC / 100);
      razem -= rabat;
      html += '<div class="rach-wiersz"><span class="r-lp">—</span>' +
        '<span class="r-poz"><b>Rabat na personalizację</b><span class="r-pod">−5% przy min. 3 produktach personalizowanych</span></span>' +
        '<span class="r-ile">—</span><span class="r-cena">—</span>' +
        '<span class="r-wart r-minus">−' + SYG.zl(rabat) + '</span></div>';
    }
    html += '<div class="rach-razem"><span>RAZEM</span><b>' + SYG.zl(razem) + '</b></div>' +
      '<p class="uw">Produkty ze sklepu płatne z góry w całości — dane do przelewu otrzymasz w e-mailu z potwierdzeniem.</p></div>';
    kontener.innerHTML = html;

    /* obsługa −/+ i usuwania */
    kontener.querySelectorAll('.rach-wiersz[data-id]').forEach(function(w){
      var id = Number(w.getAttribute('data-id'));
      w.querySelector('.minus').addEventListener('click', function(){
        KOSZYK.ustawIle(id, KOSZYK.ileProduktu(id) - 1);
        location.reload();
      });
      w.querySelector('.plus').addEventListener('click', function(){
        KOSZYK.ustawIle(id, KOSZYK.ileProduktu(id) + 1);
        location.reload();
      });
      w.querySelector('.usun').addEventListener('click', function(){
        KOSZYK.ustawIle(id, 0);
        location.reload();
      });
    });
  }

  renderuj();
  KOSZYK.odswiez();
})();
</script>
</body>
</html>
