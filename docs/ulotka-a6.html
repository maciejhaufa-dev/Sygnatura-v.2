<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="version" content="28.58?v=340">
  <title>Arkusz do druku 4x A6 na A4 — Studio Sygnatura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #E8E4DC;
      color: #33261C;
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 16px;
    }
    .ekran-pasek {
      max-width: 900px;
      margin: 0 auto 16px auto;
      background: #ffffff;
      padding: 14px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .ekran-info h1 {
      font-size: 20px;
      color: #1F3A32;
      line-height: 1.2;
    }
    .ekran-info p {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }
    .ekran-przyciski {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1.5px solid #1F3A32;
      transition: all 0.2s;
    }
    .btn-glowny { background: #1F3A32; color: #C4A582; }
    .btn-glowny:hover { background: #142721; color: #fff; }
    .btn-drugi { background: transparent; color: #1F3A32; }
    .btn-drugi:hover { background: #F3EDE2; }

    /* Arkusz A4 do druku (210 x 297 mm) */
    .arkusz-kontener {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .arkusz-a4 {
      width: 210mm;
      height: 297mm;
      min-height: 297mm;
      background: #fff;
      box-shadow: 0 10px 35px rgba(0,0,0,0.15);
      position: relative;
      display: grid;
      grid-template-columns: 105mm 105mm;
      grid-template-rows: 148.5mm 148.5mm;
      overflow: hidden;
    }
    .karta-a6 {
      width: 105mm;
      height: 148.5mm;
      position: relative;
      overflow: hidden;
    }
    .karta-a6 img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* Linie cięcia */
    .linia-pion {
      position: absolute;
      top: 0; bottom: 0; left: 105mm;
      width: 0.5px;
      border-left: 0.5px dashed #B8AEA0;
      pointer-events: none;
      z-index: 10;
    }
    .linia-poziom {
      position: absolute;
      left: 0; right: 0; top: 148.5mm;
      height: 0.5px;
      border-top: 0.5px dashed #B8AEA0;
      pointer-events: none;
      z-index: 10;
    }
    .zn-nozyczki {
      position: absolute;
      font-size: 10px;
      color: #8C8070;
      z-index: 11;
      background: #ffffff;
      padding: 0 2px;
    }
    .zn-gora { top: 2px; left: 105mm; transform: translateX(-50%); }
    .zn-dol { bottom: 2px; left: 105mm; transform: translateX(-50%); }
    .zn-lewo { top: 148.5mm; left: 2px; transform: translateY(-50%); }
    .zn-prawo { top: 148.5mm; right: 2px; transform: translateY(-50%); }

    @media print {
      body { background: transparent !important; padding: 0 !important; margin: 0 !important; }
      .ekran-pasek { display: none !important; }
      .arkusz-kontener { display: block !important; }
      .arkusz-a4 {
        box-shadow: none !important;
        margin: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }
      @page { size: A4 portrait; margin: 0; }
    }
  </style>
</head>
<body>

  <div class="ekran-pasek">
    <div class="ekran-info">
      <h1>Arkusz do druku (4x A6 na arkuszu A4)</h1>
      <p>Gotowy do bezpośredniego druku na zwykłej drukarce z liniami cięcia.</p>
    </div>
    <div class="ekran-przyciski">
      <button class="btn btn-glowny" onclick="window.print()">🖨️ Drukuj (Ctrl+P)</button>
      <a class="btn btn-drugi" href="arkusz-druku-4xa6-a4.pdf" download="arkusz-druku-4xa6-a4.pdf">📥 Pobierz PDF (Druk)</a>
      <a class="btn btn-drugi" href="assets/media/druk/arkusz-druku-4xa6-a4.jpg" download="arkusz-druku-4xa6-a4.jpg">📥 Pobierz JPG (300 DPI)</a>
      <a class="btn btn-drugi" href="admin.html">← Panel</a>
    </div>
  </div>

  <div class="arkusz-kontener">
    <div class="arkusz-a4">
      <div class="linia-pion"></div>
      <div class="linia-poziom"></div>
      <div class="zn-nozyczki zn-gora">✂</div>
      <div class="zn-nozyczki zn-dol">✂</div>
      <div class="zn-nozyczki zn-lewo">✂</div>
      <div class="zn-nozyczki zn-prawo">✂</div>

      <div class="karta-a6"><img src="uploads/Ulotka-Sygnatura-Canva.png" alt="Ulotka Sygnatura"></div>
      <div class="karta-a6"><img src="uploads/Ulotka-Sygnatura-Canva.png" alt="Ulotka Sygnatura"></div>
      <div class="karta-a6"><img src="uploads/Ulotka-Sygnatura-Canva.png" alt="Ulotka Sygnatura"></div>
      <div class="karta-a6"><img src="uploads/Ulotka-Sygnatura-Canva.png" alt="Ulotka Sygnatura"></div>
    </div>
  </div>

</body>
</html>
