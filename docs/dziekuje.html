<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dziękujemy — Studio Sygnatura</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=286">
</head>
<body data-strona="Zamówienia">
<div id="naglowek"></div>

<main class="wrap" style="text-align:center">
  <div class="sukces">
    <h2>Dziękujemy! Zamówienie zostało przyjęte.</h2>
    <p id="sygnatura"></p>
    <p>W ciągu <b>1–2 dni roboczych</b> wyślemy na Twój e-mail potwierdzenie z pełnym podsumowaniem,
    dokumentami i danymi do przelewu. Cała korespondencja będzie prowadzona pod Twoją sygnaturą sprawy.</p>
    <p id="demo-uwaga" class="mala" style="margin-top:12px"></p>
  </div>
  <div class="przyciski" style="justify-content:center">
    <a class="btn" href="index.html">Wróć na stronę główną</a>
    <a class="btn outline" href="zamowienia.html">Zobacz inne zamówienia</a>
  </div>
</main>

<div id="stopka"></div>

<script src="assets/config.js?v=286"></script>
<script src="assets/koszyk.js?v=286"></script>
<script src="assets/api.js?v=286"></script>
<script src="assets/main.js?v=286"></script>
<script>
(function(){
  var sygnatura = SYG.param('sygnatura');
  document.getElementById('sygnatura').innerHTML =
    'Sygnatura sprawy: <b style="font-size:20px;color:var(--krem)">' + (sygnatura || 'nadamy w e-mailu') + '</b>';
  if (SYG.TRYB_DEMO){
    document.getElementById('demo-uwaga').textContent =
      'To był tryb demo — zamówienie zapisało się tylko w tej przeglądarce (podgląd: admin.html). Po wdrożeniu Google Apps Script trafi do arkusza i wyśle maile.';
  }
  /* koszyk spełnił rolę — czyścimy, żeby następne zamówienie startowało od zera */
  KOSZYK.wyczysc();
})();
</script>
</body>
</html>
