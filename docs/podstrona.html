<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Sygnatura</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=293">
</head>
<body data-strona="" data-podstrona="1">
<div id="naglowek"></div>

<main class="wrap">
  <div class="regulamin" id="podstrona-tresc">
    <p class="mala">Wczytywanie…</p>
  </div>
</main>

<div id="stopka"></div>
<script src="assets/config.js?v=293"></script>
<script src="assets/koszyk.js?v=293"></script>
<script src="assets/api.js?v=293"></script>
<script src="assets/main.js?v=293"></script>
<script>
(function(){
  async function laduj(){
    var slug = SYG.param('s');
    var kontener = document.getElementById('podstrona-tresc');
    if (!slug){
      kontener.innerHTML = '<h2>Nie znaleziono podstrony</h2><p><a href="index.html" class="btn">← Strona główna</a></p>';
      return;
    }
    var odp = await SYG.wezwij('strony-lista', {});
    var strona = (odp.strony || []).find(function(s){ return s.slug === slug; });
    if (!strona){
      kontener.innerHTML = '<h2>Nie znaleziono podstrony</h2><p class="mala">Podstrona „/' + slug + '" nie istnieje (albo została usunięta).</p>' +
        '<p><a href="index.html" class="btn">← Strona główna</a></p>';
      return;
    }
    document.title = strona.tytul + ' — Studio Sygnatura';
    document.body.setAttribute('data-strona', strona.tytul);
    kontener.innerHTML = strona.tresc || '<p class="mala">Ta podstrona nie ma jeszcze treści.</p>';
    var h1 = document.getElementById('strona-tytul');
    if (h1) h1.textContent = strona.tytul;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', laduj);
  else laduj();
})();
</script>
</body>
</html>
