# Studio Sygnatura — nginx (certbot dopisze blok 443)
server {
    listen 80;
    server_name @@DOMENA@@ www.@@DOMENA@@;

    client_max_body_size 16m;

    # statyki serwowane BEZ Pythona (oszczędza CPU)
    location /static/ { alias /opt/sygnatura/repo/serwis/static/; expires 7d; }
    location /assets/ { alias /opt/sygnatura/repo/v4/assets/; expires 7d; }
    location /media/  { alias /opt/sygnatura/repo/serwis/data/uploads/; }
    location /pliki/  { alias /opt/sygnatura/repo/serwis/data/dokumenty/; }

    # reszta -> Flask
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
